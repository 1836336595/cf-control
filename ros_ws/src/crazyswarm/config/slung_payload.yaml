# MATLAB Multi-UAV-Transportation-Simulation 负载参数。
# NOKOV 刚体 load 的原点位于负载上表面中心；控制器根据 size_m.z
# 将其换算为长方体几何中心。这里的挂点使用负载几何中心坐标，ROS z-up。
slung_payload:
  enabled: true
  rigid_body: "load"
  mocap_topic: "/load/mocap_state"
  size_m: [0.08, 0.06, 0.05]        # [长, 宽, 高]。
  mass_kg: 0.023        # 负载质量，kg。 0.054 / 0.023
  # 负载几何中心的绝对目标高度，m。预抬阶段先满足 prelift_clearance_m，
  # 接管后的 reference_lift 使用此目标，不再沿用普通轨迹的 1.0 m。
  target_payload_height_m: 0.60
  # 吊运轨迹由负载参考统一驱动；ctbr_controller.yaml 的普通飞机轨迹保持 hover。
  trajectory:
    mode: hover           # hover / circle / figure_eight / attitude_cone
    radius_m: 0.50
    center_xy: [0.0, 0.0]        # 圆锥模式为固定质心 XY；八字模式为交点。
    # circle 模式时本项表示单圆圆心；注释掉本项则恢复单圆的自动圆心。
    # 不填写 null；省略 center_xy 时，八字交点为原悬停目标 XY。
    speed_mps: 0.10              # 仅单圆/八字使用，最高线速度，m/s。
    direction: ccw               # 圆锥倾斜方向从上向下看逆时针；八字右圆 ccw、左圆 cw。
    revolutions: 2.0             # 圆锥圈数，正整数；每增加一圈，扫描增加 cone_period_s（当前 30 s）。
    ramp_s: 5.0                  # 平面轨迹起停与中途姿态制动时间；圆锥进出用 cone_transition_s。
    settle_s: 3.0                # 抬升/姿态参考完成后额外保持时间，不代表实测姿态已收敛。
    cone_half_angle_deg: 15.0    # 自身 +Z 与世界 +Z 的固定夹角；仅 attitude_cone 使用。
    cone_period_s: 30.0          # 每圈各自平滑起停，当前两圈共 60 s；保持质心不动。
    cone_transition_s: 5.0       # 扫描前倾斜、扫描后回水平的时间，各自 5 s。
  # circle：负载自身 +X 指向圆心；figure_eight：+X 沿运行切线。roll/pitch 参考保持 0。
  # 圆锥模式：h20–25 倾斜，h25–55 第一圈，h55–85 第二圈，h85–90 回水平，h100 降落。
  # 若增加到 3 圈或更多，须同时延长 flight_validation_transport_s、普通 hover_duration_s
  # 和独立仿真文件的 post_handoff_s；窗口不够时启动检查会拒绝，避免扫描中途计划降落。
  # 实飞验证：进入 TAUT_RAMP 后计时，当前任务总窗口 100 s。
  # 到时从当前实测位置受控降落；不是起飞后第 100 s，也不是到达 0.60 m 后再等 100 s。
  # 先协同放下负载，确认负载落地稳定后，再保持三机 XY 分别下降并停推。
  flight_validation_enabled: true
  flight_validation_transport_s: 100.0
  # 独立的负载下降限幅；时间按实际下降距离自适应，不再取 4 s × 0.55。
  landing_payload_max_speed_mps: 0.12
  landing_payload_max_acceleration_mps2: 0.15
  landing_gain_transition_s: 2.0
  landing_unload_s: 2.0 # 实测稳定接地后才开始卸载，再转入三机下降。
  # 仅负载触地/卸载后的三机独立下降：Z 积分独立于 XY 误差门控，
  # 补偿推力模型静差，避免普通 ±0.20 积分上限导致离地低空悬停。
  landing_vertical_integral_limit: 2.0
  landing_vertical_integral_rate_limit: 0.5
  landing_vertical_feedback_limit_mps2: 8.0
  landing_touchdown_tolerance_m: 0.015 # 围绕起飞前实测地面基线的采样窗口。
  landing_touchdown_contact_margin_m: 0.006 # 窗口高度中位数须在地面基线上方 6 mm 内。
  landing_touchdown_speed_mps: 0.05 # 窗口高度斜率与速度中位数，非瞬时差分。
  landing_touchdown_confirm_s: 0.30
  landing_touchdown_window_s: 0.40
  landing_touchdown_height_span_m: 0.012
  landing_touchdown_timeout_s: 4.0 # 下降参考完成后的确认期限；超时不是确认接地。
  density_kg_m3: 0.0                # 0 表示使用 mass_kg，不按密度派生质量。
  # 依据 2026-10-01 CSV 的早期稳定运输段拟合，顺序为 [CF3, CF4, CF5]，m。
  # CSV 未记录负载姿态，因此这是几何拟合值；重新测量绳长时应优先采用实测值。
  link_lengths_m: [0.857, 0.860, 0.854] # [0.699, 0.699, 0.674] / [0.830, 0.830, 0.830]
  # 名义长度保留；TAKEUP 完成后的稳定几何窗口可校准一次运行有效值。
  # 只增加、不缩短，避免把松绳距离当成真实绳长；不回写本文件。
  link_calibration_enabled: true
  link_calibration_window_s: 3.0
  link_calibration_max_adjustment_m: 0.045
  link_calibration_max_spread_m: 0.02 # 稳定窗 P90-P10 距离波动。
  link_calibration_max_drift_mps: 0.003
  link_calibration_max_relative_speed_mps: 0.08
  link_calibration_max_sample_gap_s: 0.10
  link_calibration_min_samples: 100 # 独立时间戳，重复帧不重复计数。
  # 旧版单值参数仅作为未配置 link_lengths_m 时的兼容回退。
  link_length_m: 0.830
  mocap_hold_s: 0.20               # 负载状态短暂丢帧时保持上一周期运输输出，s。
  emergency_land_after_s: 0.50     # 负载状态持续失效后进入受控降落，s。
  # 以下四项仅在 state_observer_enabled=false 的兼容路径中使用。
  velocity_filter_cutoff_hz: 3.0   # 旧版负载速度二阶因果低通截止频率，Hz。
  velocity_filter_max_dt: 0.05     # 旧版速度样本间隔超过此值时重置滤波器，s。
  velocity_limit_mps: [1.0, 1.0, 1.0]       # 旧版速度物理限幅，m/s。
  velocity_jump_limit_mps: [0.8, 0.8, 0.8]  # 旧版速度样本最大跳变，m/s。
  # 负载状态观测器只读取 NOKOV 位姿和姿态；twist/acceleration 只写入 CSV 诊断。
  state_observer_enabled: true
  observer_position_gain: 0.35       # 位置残差修正比例，alpha。
  observer_velocity_gain: 0.20       # 与稳定 Udaan 仿真一致，速度残差修正比例，beta。
  observer_acceleration_gain: 0.02   # 加速度残差修正比例，gamma。
  observer_attitude_gain: 0.35       # SO(3) 姿态残差修正比例。
  observer_angular_rate_gain: 0.30   # 与稳定 Udaan 仿真一致，角速度残差修正比例。
  observer_max_dt: 0.05              # 源时间戳确有采样间断时重新预热；连续坏帧不会自动重置。
  observer_min_dt_s: 0.005           # 过短间隔先累积，不用极小 dt 计算导数。
  observer_nominal_dt_s: 0.010       # 原观测增益对应 100 Hz；短间隔按真实 dt 缩放修正。
  observer_position_innovation_margin_m: 0.020 # 位置创新额外裕量，另计物理运动界限。
  observer_attitude_innovation_margin_deg: 5.0 # 姿态创新额外裕量，另计角速度允许步长。
  observer_max_velocity_mps: [1.0, 1.0, 1.0]
  observer_max_acceleration_mps2: [8.0, 8.0, 8.0]
  observer_max_body_rate_rps: [8.0, 8.0, 8.0] # 候选导数触界时拒绝整帧，不再把限幅值送入姿态 PD。
  observer_min_samples: 3             # 至少收到这些个位姿样本后才允许接管。
  independent_hover_height_m: 0.50 # 实机先在更接近收绳高度处独立悬停，m。
  independent_takeoff_duration_s: 5.0 # 独立起飞到上述高度的时间，s；延长以降低上升速度。
  takeup_duration_s: 8.0           # 独立几何控制下收绳到当前负载几何目标的时间，s。
  takeup_pre_tension_slack_m: 0.0  # 实测绳距作为真实目标，不再额外扣除预张紧余量，m。
  takeup_outward_offset_m: 0.12     # TAKEUP 水平外张安全余量；平衡绳向失败时也作为回退值，m。
  takeup_distance_tolerance_m: 0.030 # 绳长确认允许的距离余量，m。
  takeup_position_tolerance_m: 0.15 # 名义 TAKEUP 目标位置偏差告警阈值，m；不再阻塞接管。
  takeup_link_angle_tolerance_deg: 10.0 # 实测绳向相对目标绳向的容差，deg。
  takeup_confirm_s: 0.50            # 几何条件同时满足的确认时间，s。
  prelift_clearance_m: 0.20         # TAKEUP 独立几何控制阶段需先将负载底面抬离地面此高度，m。
  # 负载间隙是实测门槛；飞机参考须允许继续上移，才能通过现有 PID 建立持续拉力。
  prelift_speed_mps: 0.05           # 绳长连续确认后，三机参考共同上移的最大速度，m/s。
  prelift_acceleration_mps2: 0.05   # 上移参考启动/停止时的加速度上限，m/s²。
  prelift_clearance_margin_m: 0.02  # 在间隙门槛上增加停止/接管余量，避免切换时低于 0.20 m。
  prelift_alignment_duration_s: 2.0 # 构型衔接的最短时间，s；偏差较大时按速度/加速度限幅自动延长。
  prelift_max_reference_rise_m: 1.8 # 相对预抬实测构型允许的最大参考上移量，m；达到则受控降落。
  prelift_max_reference_lead_m: 1.6 # 参考 z 相对任何一架实测 z 的最大超前量，m；达到则受控降落。
  prelift_timeout_s: 60.0           # 等待收绳/执行预抬的超时边界，s；超过则受控降落。
  prelift_lead_hold_s: 10.0         # 达到超前边界后保持参考、等待负载继续起升的时间，s。
  # 固定参考时仍由现有 PID 的 I 项增加拉力；独立起飞及 XY 积分仍用原门控/限幅。
  prelift_vertical_integral_limit: 8.0           # 预抬 z 积分状态限幅；推力/加速度饱和时停止积累。
  prelift_vertical_integral_rate_limit: 0.5      # z 积分每秒最大变化量，限制拉力增长速度。
  prelift_vertical_feedback_limit_mps2: 12.0    # 预抬 z 反馈加速度上限；总推力仍不超过各机 1.0 N。
  prelift_independent_position_gain_scale: [4.0, 4.0, 1.0] # 预抬期间加强 XY PID，防止绳张力把飞机拉向负载中心。
  prelift_independent_velocity_gain_scale: [2.0, 2.0, 1.0]
  prelift_max_tilt_deg: 12.0        # 仅预抬 XY 抗绳向内拉，普通/协同阶段仍使用各自倾角限制。
  prelift_confirm_s: 0.50           # 离地间隙和低竖直速度连续满足的确认时间，s。
  prelift_vertical_velocity_tolerance_mps: 0.05 # 允许切换协同控制的负载竖直速度，m/s。
  takeup_diagnostic_interval_s: 1.0 # TAKEUP 未接管时终端诊断输出周期，s。
  activation_hold_s: 0.30            # 绳长确认后负载状态连续有效的接管等待时间，s。
  tension_ramp_s: 5.0                # MATLAB TAUT_RAMP 张力建立时间，s。
  # 接管后使用几何参考串级：负载张力分配 + 三机位置保持。
  # coupled 为原绳向反馈/期望负载加速度补偿方法，保留用于离线对照。
  transport_force_mode: reference_cascade
  # 从接管时实测姿态/绳向平滑转到水平静力平衡构型，使用同一个五次时间参数。
  transport_attitude_reference_enabled: true
  transport_equilibrium_reference_enabled: true
  transport_attitude_reference_s: 12.0 # 从 TAUT_RAMP 起点计时，五次曲线，端点角速度/角加速度为零。
  # Udaan 同款张力渐增位置保持：协同力逐步接管时仍保持 TAKEUP 实测锚点，
  # 防止水平绳张力把三架飞机拉向负载中心。
  ramp_position_hold_gain_scale: 2.0
  reference_lift_s: 12.0             # 与稳定 Udaan 仿真一致，张力建立后抬升参考的时间，s。
  # 以下两项仅 coupled 模式启用；reference_cascade 中绳向反馈实际倍率固定为 0，
  # 由跟踪平衡构型的三机位置保持提供阻尼，CSV 记录有效倍率和实际模式。
  transport_link_gain_scale: 0.4
  transport_link_steady_gain_scale: 0.4
  # 稳态运输保持增益；预抬接管的保持项在 reference_lift_s 内平滑消退到此值。
  transport_position_hold_gain_scale: 1.5
  # 两种 reference_cascade 飞机反馈共用：负载姿态误差缓慢修正三机三维参考。
  # 期望姿态仍保持当前水平/零航向；本项不把姿态目标改成补偿角。
  transport_attitude_trim_enabled: true
  # false：原静态调平，运动时冻结；true：按瞬时期望姿态持续更新有界的世界系构型补偿。
  transport_attitude_trim_dynamic_enabled: true # 当前启用动态；省略时兼容静态模式，原增益/预算不变。
  # 仅动态补偿：张力渐增完成且协同混合=1后，边抬升/调平边更新，当前最早h5；false恢复h17。
  transport_attitude_trim_during_lift_enabled: true
  transport_attitude_trim_feedback_max_rate_rps: 0.50 # 仅暂停补偿更新，不改负载姿态环的角速度反馈。
  transport_attitude_trim_feedback_pose_jump_deg: 1.0 # 相邻源位姿额外允许步长，另加 max_rate * 源时间间隔。
  transport_attitude_trim_feedback_recovery_s: 0.50 # 异常之后连续恢复所需时间。
  transport_attitude_trim_gain_per_s: [0.05, 0.10, 0.01] # 三轴慢补偿；动态开关为 false 时保留原冻结策略。
  transport_attitude_trim_limit_m: 0.010 # 最大任一飞机参考偏置的三维范数，m。
  transport_attitude_trim_rate_limit_mps: 0.0015
  transport_attitude_trim_acceleration_limit_mps2: 0.002
  transport_attitude_trim_interval_s: 1.0 # 每段五次平滑修正的时间，s。
  # 飞机运输反馈选择： differential_integral 保持当前实飞方案；
  # native_position_pid 复用 GeometricCtbrController 的位置 PID（仅 reference_cascade）。
  # 两者互斥；native 模式不叠加下方差分积分，普通位置积分状态仍冻结。
  transport_feedback_controller: native_position_pid
  # 下列仅 native_position_pid 生效：Ki 和积分状态上限分别乘倍率，
  # 沿用各机 independent_position/velocity_gain，保持 PD 倍率仍由上方两项控制。
  transport_position_pid_integral_gain_scale: 3.0
  transport_position_pid_integral_limit_scale: 3.3333333333333335
  transport_position_pid_integral_gate_m: 0.23
  # 运输 I 更新：I_dot = weight * e_v + 0.5 * e_p；0 仅积分位置，1 恢复原公式。
  # 仅影响 native_position_pid 的 I 项，D 项仍使用 EKF 速度；省略时兼容旧值 1。
  transport_position_pid_integral_velocity_weight: 1.0
  transport_position_pid_force_limit_n: 0.06 # 只限制新增 I 力的三维范数，不限制整个 PID。
  transport_position_pid_force_rate_limit_nps: 0.004 # 只限制新增 I 力变化率，N/s。
  # 仅 reference_cascade：三机位置保持误差去除共同分量后，学习零和的世界系力偏置。
  # 姿态/平动参考均完成且反馈有效、主机未限幅时更新；不解冻普通位置积分器。
  transport_hold_integral_enabled: true
  transport_hold_integral_gain_npm_s: 0.05 # N/(m*s)。
  transport_hold_integral_force_limit_n: 0.04 # 每机三维力范数上限，N；0.03 实飞持续触边，本轮只增加力预算。
  transport_hold_integral_rate_limit_nps: 0.002 # 学习期间每机力变化率范数上限，N/s。
  # 接管和运输的实测构型保护；达到实际间距边界立即受控降落。
  minimum_vehicle_distance_m: 0.30
  separation_prediction_s: 0.35
  transport_height_error_limit_m: 0.08
  transport_fault_confirm_s: 2.20  # 预测靠近/掉高/持续横向速率饱和的确认时间。
  # 保留预抬输出相对协同模型的竖直差额，用有界 I 项慢调，不重复叠加负载重量。
  transport_support_trim_limit_n: 0.25 # 普通 I 上限；接管时在总推力余量内继承完整实测残差。
  transport_support_integral_gain_npm_s: 0.20
  transport_support_trim_rate_nps: 0.03
  landing_approach_fraction: 0.55    # MATLAB 降落前段保持绷紧控制的时长比例。

  # MATLAB 挂点顺序 [CF3, CF4, CF5]：+x 棱中点、-x/+y 顶点、-x/-y 顶点。
  # 三个点全部位于负载上表面 z=+h/2；每行是一个 [x, y, z] 挂点。
  attachment_points_m:
    - [0.040,  0.000,  0.025]   # CF3：+x 棱中点
    - [-0.040, 0.030,  0.025]   # CF4：-x/+y 顶点
    - [-0.040, -0.030, 0.025]   # CF5：-x/-y 顶点

  # 负载位置外环，对应 MATLAB loadController.kx/kv/ki/c1。
  position_gain: [3.0, 3.0, 3.75]
  velocity_gain: [3.12, 3.12, 3.12]
  integral_gain: [1.60, 1.60, 1.60]
  integral_limit: [0.50, 0.50, 0.50]
  c1: 0.50

  # 负载姿态环：MATLAB 按负载惯量和目标带宽自动生成 kR/kOmega。
  attitude_bandwidth_hz: [1.5, 1.5, 0.7]
  # 本轮保持 0.90，单独验证绳向力限制器修复；不以阻尼比取代稳定性验证。
  attitude_damping_ratio: 0.90
  yaw_channel_enabled: true

  # 张力分配数值保护和绳向环参数。
  force_norm_epsilon: 1.0e-9
  tension_pinv_tolerance: 1.0e-9
  link_kq: 40.0
  link_komega: 20.0
  link_integral_gain: 0.0
  link_integral_limit: [0.30, 0.30, 0.30]
  outward_bias_fraction: 0.25
  outward_bias_max_n: 0.15
  # 每架无人机期望力的导数限幅，供 Omega_c 前馈使用，N/s。
  force_dot_limit_nps: 20.0
  link_force_correction_limit_n: 0.40
  link_force_correction_rate_limit_nps: 20.0
