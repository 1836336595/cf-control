# MATLAB Multi-UAV-Transportation-Simulation 负载参数。
# NOKOV 刚体 load 的原点位于负载上表面中心；控制器根据 size_m.z
# 将其换算为长方体几何中心。这里的挂点使用负载几何中心坐标，ROS z-up。
slung_payload:
  enabled: true
  rigid_body: "load"
  mocap_topic: "/load/mocap_state"
  size_m: [0.08, 0.06, 0.05]        # [长, 宽, 高]。
  mass_kg: 0.053
  density_kg_m3: 0.0                # 0 表示使用 mass_kg，不按密度派生质量。
  link_length_m: 0.65
  mocap_hold_s: 0.20               # 负载状态短暂丢帧时保持上一周期运输输出，s。
  emergency_land_after_s: 0.30     # 负载状态持续失效后进入受控降落，s。
  velocity_filter_cutoff_hz: 5.0   # 负载 NOKOV 速度二阶因果低通截止频率，Hz。
  velocity_filter_max_dt: 0.05     # 负载速度样本间隔超过此值时重置滤波器，s。
  independent_hover_height_m: 0.30 # MATLAB SLACK 阶段每架飞机独立悬停高度，m。
  independent_takeoff_duration_s: 2.5 # 独立起飞到上述高度的时间，s。
  takeup_duration_s: 2.5           # MATLAB TAKEUP 收紧到绳长的时间，s。
  takeup_outward_offset_m: 0.12     # 收紧时相对挂点的水平外张距离，m。
  takeup_distance_tolerance_m: 0.03 # 绳长确认允许的距离余量，m。
  takeup_confirm_s: 0.30            # 三根绳同时满足距离条件的确认时间，s。
  activation_hold_s: 1.0             # 负载状态连续有效后才允许接管，s。
  tension_ramp_s: 1.5                # MATLAB TAUT_RAMP 张力建立时间，s。
  reference_lift_s: 3.0              # 张力建立后将负载参考抬到目标高度的时间，s。

  # MATLAB 挂点顺序 [CF3, CF4, CF5]：+x 棱中点、-x/+y 顶点、-x/-y 顶点。
  # 三个点全部位于负载上表面 z=+h/2；每行是一个 [x, y, z] 挂点。
  attachment_points_m:
    - [0.040,  0.000,  0.025]   # CF3：+x 棱中点
    - [-0.040, 0.030,  0.025]   # CF4：-x/+y 顶点
    - [-0.040, -0.030, 0.025]   # CF5：-x/-y 顶点

  # 负载位置外环，对应 MATLAB loadController.kx/kv/ki/c1。
  position_gain: [3.0, 3.0, 3.75]
  velocity_gain: [3.12, 3.12, 3.12]
  integral_gain: [1.60, 1.60, 1.60]
  integral_limit: [0.50, 0.50, 0.50]
  c1: 0.50

  # 负载姿态环：MATLAB 按负载惯量和目标带宽自动生成 kR/kOmega。
  attitude_bandwidth_hz: [6.0, 6.0, 0.45]
  attitude_damping_ratio: 0.90
  yaw_channel_enabled: true

  # 张力分配数值保护和绳向环参数。
  force_norm_epsilon: 1.0e-9
  tension_pinv_tolerance: 1.0e-9
  link_kq: 55.0
  link_komega: 20.0
  link_integral_gain: 0.0
  link_integral_limit: [0.30, 0.30, 0.30]
  outward_bias_fraction: 0.20
  outward_bias_max_n: 0.12
