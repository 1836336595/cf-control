# Crazyflie 实机参数。运输控制器仍使用这些质量、推力标定和速率限制。
# payload_attachment_index 明确 MATLAB 矩阵列与飞机的对应关系：
# 1=CF3 前方，2=CF4 左下，3=CF5 右下。

ctbr_controller_cf3:
  payload_attachment_index: 1
  mass_kg: 0.0434
  max_total_thrust_newton: 1.176798
  max_command_thrust_newton: 0.95
  takeoff_min_thrust_newton: 0.30
  airborne_min_thrust_newton: 0.30
  max_tilt_deg: 10.0
  max_body_rate_radps: [3.0, 3.0, 2.0]
  position_gain: [0.75, 0.75, 0.45]
  velocity_gain: [0.45, 0.45, 0.35]
  integral_gain: [0.40, 0.40, 0.20]
  integral_limit: [0.8, 0.8, 0.8]
  attitude_gain: [2.0, 2.0, 2.0]
  attitude_integral_gain: [0.4, 0.4, 0.4]
  attitude_integral_limit: [0.8, 0.8, 0.8]
  position_integral_c1: 0.35
  use_body_rate_feedforward: true
  omega_c_method: analytic
  omega_c_force_norm_epsilon: 1.0e-7
  omega_c_heading_projection_epsilon: 1.0e-6
  transport_attitude_gain: [240.0, 240.0, 120.0]
  transport_rate_gain: [4.0, 4.0, 4.0]
  preflight_voltage_reference_v: 4.20
  preflight_raw_scale_exponent: 1.0
  preflight_raw_scale_min: 0.90
  preflight_raw_scale_max: 1.12

