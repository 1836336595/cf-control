# Simulation candidate for the external 70 Hz CTBR rate-setpoint loop.
# Loaded only by simulate_slung_handoff.py unless explicitly added to roslaunch.
ctbr_controller_cf3:
  transport_attitude_gain: [6.0, 6.0, 3.0]
  transport_rate_gain: [2.0, 2.0, 1.0]
  transport_body_rate_filter_tau_s: 0.0
  transport_force_filter_tau_s: 0.005
  
ctbr_controller_cf4:
  transport_attitude_gain: [6.0, 6.0, 3.0]
  transport_rate_gain: [2.0, 2.0, 1.0]
  transport_body_rate_filter_tau_s: 0.0
  transport_force_filter_tau_s: 0.005
  
ctbr_controller_cf5:
  transport_attitude_gain: [6.0, 6.0, 3.0]
  transport_rate_gain: [2.0, 2.0, 1.0]
  transport_body_rate_filter_tau_s: 0.0
