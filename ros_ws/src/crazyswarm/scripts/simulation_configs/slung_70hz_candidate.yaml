# Graefe 2026 motor plant: selected 70 Hz Mellinger candidate, 60/120 s validation.
# Loaded only by simulate_slung_handoff.py unless explicitly added to roslaunch.
ctbr_controller_cf3:
  transport_attitude_gain: [12.0, 12.0, 6.0]
  transport_rate_gain: [0.25, 0.25, 0.125]
  transport_body_rate_filter_tau_s: 0.0
  transport_force_filter_tau_s: 0.005
  
ctbr_controller_cf4:
  transport_attitude_gain: [12.0, 12.0, 6.0]
  transport_rate_gain: [0.25, 0.25, 0.125]
  transport_body_rate_filter_tau_s: 0.0
  transport_force_filter_tau_s: 0.005
  
ctbr_controller_cf5:
  transport_attitude_gain: [12.0, 12.0, 6.0]
  transport_rate_gain: [0.25, 0.25, 0.125]
  transport_body_rate_filter_tau_s: 0.0
  transport_force_filter_tau_s: 0.005

slung_payload:
  # 完整 60 s 离线观察；默认实飞文件则开启 10 s 自动降落验证。
  flight_validation_enabled: false
  transport_link_gain_scale: 0.4
  transport_link_steady_gain_scale: 0.4
  transport_position_hold_gain_scale: 0.5
  link_force_correction_limit_n: 0.40
  link_force_correction_rate_limit_nps: 20.0

slung_simulation:
  post_handoff_s: 60.0
